<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 680px; overflow: hidden; }
      body {
        font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        color: #1d1d1d;
        background:
          radial-gradient(900px 520px at 18% 0%, #dbe5ff 0%, transparent 60%),
          radial-gradient(760px 520px at 100% 100%, var(--accent-soft) 0%, transparent 60%),
          #f6f8fb;
        position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(#dde5ed 1px, transparent 1px),
          linear-gradient(90deg, #dde5ed 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
        opacity: 0.7;
      }
      .wrap {
        position: relative; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 44px;
      }
      .pill {
        font-size: 18px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
        color: #406ae4; background: #fff; border: 1px solid #dde5ed;
        padding: 10px 22px; border-radius: 999px;
      }
      .row { display: flex; align-items: center; gap: 36px; }
      .card {
        width: 380px; height: 200px; border-radius: 28px;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
        box-shadow: 0 30px 60px -30px rgba(29, 29, 29, 0.35), 0 0 0 6px rgba(221, 229, 237, 0.7);
      }
      .card .name { font-size: 54px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
      .card .sub { font-size: 20px; font-weight: 500; opacity: 0.8; }
      .us { background: linear-gradient(135deg, #406ae4, #5290f4); color: #fff; }
      .them { background: #fff; color: #1d1d1d; }
      .them .sub { color: #4d585f; opacity: 1; }
      .vs {
        width: 84px; height: 84px; border-radius: 50%;
        display: grid; place-items: center;
        background: #1d1d1d; color: #fff; font-size: 28px; font-weight: 700;
      }
      .tag { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; color: #1d1d1d; text-align: center; max-width: 900px; }
      .tag span { color: #406ae4; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div class="pill">Honest comparison</div>
      <div class="row">
        <div class="card us"><div class="name">HireDue</div><div class="sub">AI job agent · desktop</div></div>
        <div class="vs">VS</div>
        <div class="card them"><div class="name" id="name"></div><div class="sub" id="sub"></div></div>
      </div>
      <div class="tag" id="tag"></div>
    </div>
    <script>
      const p = new URLSearchParams(location.search);
      document.getElementById("name").textContent = p.get("name");
      document.getElementById("sub").textContent = p.get("sub");
      document.getElementById("tag").innerHTML = p.get("tag");
      document.body.style.setProperty("--accent-soft", p.get("accent") || "#e2f5ff");
    </script>
  </body>
</html>
